server:
  port: ${PORT:8080}            # o Render informa a porta em PORT
  # atrás do proxy HTTPS do Render: lê X-Forwarded-Proto (cookie Secure) e o IP real
  forward-headers-strategy: native
  servlet:
    session:
      persistent: false

spring:
  data:
    mongodb:
      # MongoDB local por padrão; em produção (Render) defina CARGAME_MONGODB_URI (nome próprio do jogo,
      # para não usar por engano um MONGODB_URI de outro projeto) com a string do
      # MongoDB Atlas, por exemplo mongodb+srv://usuario:senha@cluster.xxxxx.mongodb.net/cargame
      uri: ${CARGAME_MONGODB_URI:mongodb://localhost:27017/cargame}
      # banco do jogo, sempre este, mesmo que a URL termine com outro nome (ex.: o banco de outro
      # projeto no mesmo cluster): assim o jogo nunca cria coleções nem índices fora dele
      database: ${CARGAME_MONGODB_DATABASE:cargame}
      # cria os índices declarados nas classes (nome de usuário único, TTL das sessões, ranking)
      auto-index-creation: true
#dskflj
game:
  # pasta do jogo (index.html, dist/, assets/, src/styles/), relativa a server/
  static-dir: ..
  session:
    cookie-name: CG_SESSION
    days: 30
  economy:
    car-price: 1000            # preço de um carro na loja
    paint-part-price: 150      # pintar uma peça
    full-paint-discount: 0.10  # pintar o carro inteiro: soma das peças menos 10%
    suspension-price-per-cm: 30
    coins-per-point: 0.02      # 1 moeda a cada 50 pontos de drift
    max-drift-points-per-second: 3500
    max-drift-seconds: 120
  taxi:
    base-fare: 10              # bandeirada
    per-km: 60                 # moedas por km da rota (1 km = 70, 3 km = 190)
    min-route-meters: 150
    max-route-meters: 6000
    max-average-speed: 45      # m/s (162 km/h): mais rápido que isso a corrida é recusada
    max-minutes: 30
  fuel:
    price-per-liter: 6         # moedas por litro
    start-fraction: 0.5        # carro novo na garagem vem com meio tanque
    courtesy-liters: 5         # pane seca sem moedas: o frentista dá 5 L
  rooms:
    global-map: salto
    global-max-players: 32
    private-max-players: 8
