# Blueprint do Render: New → Blueprint → escolha este repositório.
# Cria o serviço web a partir do Dockerfile da raiz.
services:
  - type: web
    name: drift-br
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/catalog
    autoDeploy: true
    envVars:
      # string de conexão do MongoDB (ex.: MongoDB Atlas, plano gratuito M0):
      # mongodb+srv://usuario:senha@cluster.xxxxx.mongodb.net/cargame
      # o Render pede o valor na criação; ele não fica no repositório
      - key: CARGAME_MONGODB_URI
        sync: false
